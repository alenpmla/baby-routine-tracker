services:
  baby-tracker:
    build: .
    container_name: baby-tracker
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      PORT: 3000
      HTTPS_PORT: 3443
      CERT_DIR: /data/certs
      CERT_HOSTS: ${CERT_HOSTS:-homeserver localhost 192.168.2.38}
      DATA_FILE: /data/bt.json
    volumes:
      - ./data:/data
    restart: unless-stopped
