<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4efe7" media="(prefers-color-scheme: light)" id="theme-color-light" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" id="theme-color-dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby Tracker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Baby Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('bt.theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
